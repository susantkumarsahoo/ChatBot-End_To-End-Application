[supervisord]
nodaemon=true
user=appuser
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ─────────────────────────────────────────
; Backend — FastAPI via Uvicorn
; ─────────────────────────────────────────
[program:backend]
command=python -m uvicorn backend:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true          ; restart automatically if it crashes
startretries=5
startsecs=5               ; must stay up 5 s to be considered "started"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1                ; start backend first

; ─────────────────────────────────────────
; Frontend — Streamlit
; ─────────────────────────────────────────
[program:frontend]
command=python -m streamlit run frontend_app.py
    --server.port=8501
    --server.address=0.0.0.0
    --server.headless=true
    --browser.gatherUsageStats=false
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2                ; start frontend after backend