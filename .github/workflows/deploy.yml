name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Stop and remove old container
        run: |
          docker stop chatbot 2>/dev/null || true
          docker rm   chatbot 2>/dev/null || true

      - name: Pull latest image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Run new container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker run -d \
            --name chatbot \
            --restart always \
            -p 8000:8000 \
            -p 8501:8501 \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}" \
            -e API_URL="http://localhost:8000/chat" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          # Allow extra time for Docker's start-period (40s) to elapse first
          echo "Sleeping 45s for container start-period..."
          sleep 45

          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' chatbot 2>/dev/null || echo "unknown")
            STATE=$(docker inspect  --format='{{.State.Status}}'        chatbot 2>/dev/null || echo "unknown")
            echo "  Attempt $i/24 — health: $STATUS | state: $STATE"

            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi

            if [ "$STATE" = "exited" ] || [ "$STATUS" = "unhealthy" ]; then
              echo "Container failed to start. Logs:"
              docker logs chatbot
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting. Logs:"
          docker logs chatbot
          exit 1

      - name: Clean up old Docker images
        run: |
          docker image prune -f




