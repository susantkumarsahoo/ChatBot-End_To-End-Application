[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ─────────────────────────────────────────
; Backend — FastAPI via Uvicorn
; ─────────────────────────────────────────
[program:backend]
command=python -m uvicorn backend:app --host 0.0.0.0 --port 8000
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

; ─────────────────────────────────────────
; Frontend — Streamlit
; ─────────────────────────────────────────
[program:frontend]
command=python -m streamlit run frontend_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2