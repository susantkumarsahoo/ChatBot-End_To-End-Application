[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
; /tmp is world-writable — safe for the non-root-spawned appuser processes
; and accessible by the root-running supervisord process.
pidfile=/tmp/supervisord.pid

; ─────────────────────────────────────────
; Backend — FastAPI via Uvicorn
; Starts first (priority=1); frontend waits until this is stable.
; ─────────────────────────────────────────
[program:backend]
command=python -m uvicorn backend:app --host 0.0.0.0 --port 8000
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=5
; startsecs: supervisord waits this many seconds before considering the
; process successfully started. 10 s gives the backend time to connect
; to Secrets Manager on a cold start without being killed as "failed".
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1

; ─────────────────────────────────────────
; Frontend — Streamlit
; Starts after backend (priority=2).
; API_URL is forwarded so the frontend can reach the backend inside
; the same container. Override it at `docker run -e API_URL=...` if you
; ever split the services into separate containers.
; ─────────────────────────────────────────
[program:frontend]
command=python -m streamlit run frontend_app.py
    --server.port=8501
    --server.address=0.0.0.0
    --server.headless=true
    --browser.gatherUsageStats=false
directory=/app
user=appuser
; Pass the API_URL env var into the frontend process.
; %(ENV_API_URL)s reads the variable set in `docker run -e API_URL=...`.
; Falls back to localhost when the variable is absent (same-container deploy).
environment=API_URL="%(ENV_API_URL)s"
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=2


# supervisord.conf