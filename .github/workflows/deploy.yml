name: Deploy Chatbot to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if not exists, else pull latest
            if [ ! -d "/home/ubuntu/chatbot" ]; then
              git clone https://github.com/${{ secrets.GITHUB_USERNAME }}/${{ secrets.REPO_NAME }}.git /home/ubuntu/chatbot
            fi

            cd /home/ubuntu/chatbot
            git pull origin main

            # Build and restart Docker container
            docker build -t chatbot .
            docker stop chatbot || true
            docker rm chatbot || true
            docker run -d \
              --name chatbot \
              -p 8000:8000 \
              -p 8501:8501 \
              chatbot