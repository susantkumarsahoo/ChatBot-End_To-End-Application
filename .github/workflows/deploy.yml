name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: ["main"]

# Prevent concurrent deployments — if a new push arrives while a deploy is
# running, cancel the in-progress run and start fresh.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ─────────────────────────────────────────────────────────────────
  # CI — build and push to ECR (runs on GitHub-hosted runner)
  # ─────────────────────────────────────────────────────────────────
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # ─────────────────────────────────────────────────────────────────
  # CD — pull the new image onto EC2 and restart the container
  # The self-hosted runner must have the GitHub Actions runner service
  # installed on the EC2 instance. An IAM instance role with
  # ecr:GetAuthorizationToken + ecr:BatchGetImage is recommended;
  # the explicit key/secret below also work without a role.
  # ─────────────────────────────────────────────────────────────────
  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull exact image built in CI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Stop and remove old container
        run: |
          docker stop chatbot 2>/dev/null || true
          docker rm   chatbot 2>/dev/null || true

      - name: Start new container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker run -d \
            --name chatbot \
            --restart always \
            -p 8000:8000 \
            -p 8501:8501 \
            -e API_URL="http://localhost:8000/chat" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Wait for the container's HEALTHCHECK to pass.
      # Falls back gracefully if the container has no HEALTHCHECK defined
      # (status will be "" or "none") by also accepting a running container
      # after the start-period.
      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container health check..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' chatbot 2>/dev/null || echo "unknown")
            STATE=$(docker inspect  --format='{{.State.Status}}'        chatbot 2>/dev/null || echo "unknown")
            echo "  Attempt $i/20 — health: $STATUS | state: $STATE"

            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi

            # If the image has no HEALTHCHECK the status is "" (empty string).
            # In that case, just confirm the container is still running after
            # a 30-second grace period.
            if [ -z "$STATUS" ] || [ "$STATUS" = "none" ]; then
              if [ "$STATE" = "running" ] && [ "$i" -ge 7 ]; then
                echo "No HEALTHCHECK defined; container is running — treating as healthy."
                exit 0
              fi
            fi

            if [ "$STATE" = "exited" ] || [ "$STATUS" = "unhealthy" ]; then
              echo "Container failed to start."
              docker logs chatbot
              exit 1
            fi

            sleep 5
          done

          echo "Container did not become healthy in time."
          docker logs chatbot
          exit 1

      # Remove dangling images AND old SHA-tagged images for this repo
      # to prevent disk exhaustion over many deployments.
      - name: Clean up old Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker image prune -f

          # Remove all local tags for this repo except the one just deployed
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
            | grep "^$ECR_REGISTRY/$ECR_REPOSITORY:" \
            | grep -v ":$IMAGE_TAG " \
            | grep -v ":latest " \
            | awk '{print $1}' \
            | xargs -r docker rmi --force 2>/dev/null || true





